version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-portfolio}-app
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - .env
    volumes:
      - storage-data:/var/www/html/storage/app/public
      - storage-logs:/var/www/html/storage/logs
    networks:
      - dokploy-network

volumes:
  storage-data:
  storage-logs:

networks:
  dokploy-network:
    driver: bridge
