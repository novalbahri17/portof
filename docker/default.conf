server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Handle Dokploy / reverse proxy headers
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    # Aset ber-hash (Vite menaruh hash di nama file) — aman di-cache 1 tahun.
    # PENTING: hanya /build/assets/ yang dibuat immutable. Manifest dan aset
    # non-hash TIDAK boleh immutable, karena nama file-nya tetap walau isinya
    # berubah — kalau di-cache 1 tahun, update tidak akan pernah terlihat.
    location /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest & sisa folder build: jangan cache, supaya versi baru langsung terbaca.
    location /build/ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Aset di luar /build/ (favicon, logo, font) — nama file tidak ber-hash,
    # jadi cukup cache pendek supaya pergantian logo/favicon tetap terlihat.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
